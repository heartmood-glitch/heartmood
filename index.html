<main class="wrap"><aside class="side"><div id="searchnotice" class="searchnotice">Aktive Suche: Kategorie- und Seitenfilter werden ignoriert.</div><h3>Filter</h3><div class="ctl"><label>Kategorie</label><select id="cat"><option value="">Alle Kategorien</option></select></div><div class="ctl"><label>Installiert</label><select id="inst"><option value="">Alle</option><option value="yes">Ja</option><option value="no">Nein</option></select></div><div class="ctl"><label>Kostenlos</label><select id="free"><option value="">Alle</option><option value="yes">Ja</option><option value="no">Nein</option></select></div><h3>Sortierung</h3><div class="ctl"><select id="sort"><option value="score">Relevanz</option><option value="az">Name A–Z</option><option value="za">Name Z–A</option><option value="cat">Kategorie</option><option value="rank">Rang</option></select></div><div class="checks"><label><input id="hide" type="checkbox" checked> Leere Felder ausblenden</label><label><input id="compact" type="checkbox" checked> Lange Texte einklappen</label></div><button id="reset" class="btn" style="width:100%">Filter zurücksetzen</button></aside><section><div id="err"></div><div class="stats"><div class="stat"><b id="shown">–</b><span>angezeigt</span></div><div class="stat"><b id="total">–</b><span>gesamt</span></div><div class="stat"><b id="cats">–</b><span>Kategorien</span></div><div class="stat"><b id="avg">–</b><span>Ø Relevanz</span></div></div><div class="head"><span id="meta">Lade Daten …</span><div class="toggle"><button id="vc" class="on">Karten</button><button id="vt">Tabelle</button></div></div><div id="cards" class="cards"></div><div id="table" hidden></div></section></main>

const URL='https://epakearutehemjakjmvq.supabase.co/rest/v1/rpc/get_plugins_for_web',KEY='sb_publishable_nzaPPVShDGNvkdbU_Wnvaw_1ChzOPT4';
const DEF=['Kategorie','Relevanzscore (0-100)','Kernfunktion','Bei dir installiert','Normaler Chat (Plus)?','Schreiben/Aktionen','Kostenloser Basistarif?','Free-Limits / Funktionen','Automatisierungspotenzial','Praktischer Nutzen im Free-Limit'];

let rows=[],filtered=[],fields=[],selected=new Set(),view=localStorage.plugin_view||'cards',active=null,detailAll=false,suggestIndex=-1,suggestions=[];
const $=x=>document.getElementById(x),norm=v=>String(v??'').trim(),low=v=>norm(v).toLocaleLowerCase('de'),yes=v=>/^(ja|yes|true)\b/i.test(norm(v)),no=v=>/^(nein|no|false)\b/i.test(norm(v)),num=v=>{let m=norm(v).replace(',','.').match(/-?\d+(?:\.\d+)?/);return m?+m[0]:NaN},p=r=>r?.payload&&typeof r.payload==='object'?r.payload:{},val=(r,f)=>f==='Plugin'?(p(r).Plugin||r.plugin_name||''):p(r)[f],has=v=>v!==null&&v!==undefined&&(typeof v!=='string'||v.trim()!=='')&&(!Array.isArray(v)||v.length),text=v=>v&&typeof v==='object'?JSON.stringify(v,null,2):String(v??'');
function rich(el,s){el.textContent='';let re=/(https?:\/\/[^\s<>"')\]]+)/g,last=0,m;while((m=re.exec(s))){if(m.index>last)el.append(document.createTextNode(s.slice(last,m.index)));let a=document.createElement('a');a.href=m[0];a.target='_blank';a.rel='noopener';a.textContent=m[0];el.append(a);last=m.index+m[0].length}if(last<s.length)el.append(document.createTextNode(s.slice(last)))}
function order(fs){let pos=new Map(PRI.map((x,i)=>[x,i]));return [...fs].sort((a,b)=>(pos.get(a)??9999)-(pos.get(b)??9999)||a.localeCompare(b,'de'))}
function levenshtein(a,b){a=low(a);b=low(b);const m=a.length,n=b.length;let prev=Array.from({length:n+1},(_,i)=>i),cur=new Array(n+1);for(let i=1;i<=m;i++){cur[0]=i;for(let j=1;j<=n;j++)cur[j]=Math.min(cur[j-1]+1,prev[j]+1,prev[j-1]+(a[i-1]===b[j-1]?0:1));[prev,cur]=[cur,prev]}return prev[n]}
function nameScore(row,q){const name=low(val(row,'Plugin'));if(!q)return 999;if(name===q)return 0;if(name.startsWith(q))return 1;const words=name.split(/[^\p{L}\p{N}]+/u).filter(Boolean);if(words.some(w=>w.startsWith(q)))return 2;if(name.includes(q))return 3;const d=levenshtein(name,q);if(q.length>=4&&d<=2)return 4+d/10;let best=99;for(const w of words){const wd=levenshtein(w,q);if(q.length>=4&&wd<=2)best=Math.min(best,5+wd/10)}return best}
function searchable(row){return [val(row,'Plugin'),row.plugin_name,...Object.keys(p(row)),...Object.values(p(row)).map(text)].join(' ').toLocaleLowerCase('de')}
function searchMatch(row,q){const ns=nameScore(row,q);if(ns<99)return {ok:true,score:ns};if(searchable(row).includes(q))return {ok:true,score:20};return {ok:false,score:999}}
async function load(){try{let r=await fetch(URL,{method:'POST',headers:{apikey:KEY,'Content-Type':'application/json'},body:'{}'});if(!r.ok)throw Error(await r.text());rows=await r.json();let u=new Set(['Plugin']);rows.forEach(x=>Object.keys(p(x)).forEach(k=>u.add(k)));fields=order(u);let saved;try{saved=JSON.parse(localStorage.plugin_fields||'null')}catch{}selected=new Set((Array.isArray(saved)?saved:DEF).filter(x=>u.has(x)));selected.add('Plugin');fillCats();fieldGrid();apply()}catch(e){$('err').innerHTML='<div class="err">Daten konnten nicht geladen werden: '+String(e.message).replace(/[<>]/g,'')+'</div>'}}
function fillCats(){let cs=[...new Set(rows.map(r=>norm(val(r,'Kategorie'))).filter(Boolean))].sort((a,b)=>a.localeCompare(b,'de'));cs.forEach(c=>{let o=document.createElement('option');o.value=o.textContent=c;$('cat').append(o)})}
function apply(){let q=low($('q').value),cat=$('cat').value,inst=$('inst').value,free=$('free').value;$('clearq').style.display=q?'block':'none';$('searchnotice').classList.toggle('on',!!q);if(q){filtered=rows.map(r=>({r,m:searchMatch(r,q)})).filter(x=>x.m.ok).sort((a,b)=>a.m.score-b.m.score||norm(val(a.r,'Plugin')).localeCompare(norm(val(b.r,'Plugin')),'de')).map(x=>x.r)}else{filtered=rows.filter(r=>{if(cat&&norm(val(r,'Kategorie'))!==cat)return false;if(inst==='yes'&&!yes(val(r,'Bei dir installiert')))return false;if(inst==='no'&&!no(val(r,'Bei dir installiert')))return false;if(free==='yes'&&!yes(val(r,'Kostenloser Basistarif?')))return false;if(free==='no'&&!no(val(r,'Kostenloser Basistarif?')))return false;return true});let s=$('sort').value;filtered.sort((a,b)=>s==='az'?norm(val(a,'Plugin')).localeCompare(norm(val(b,'Plugin')),'de'):s==='za'?norm(val(b,'Plugin')).localeCompare(norm(val(a,'Plugin')),'de'):s==='cat'?norm(val(a,'Kategorie')).localeCompare(norm(val(b,'Kategorie')),'de'):s==='rank'?(num(val(a,'Rang in Kategorie'))||9999)-(num(val(b,'Rang in Kategorie'))||9999):(num(val(b,'Relevanzscore (0-100)'))||-1)-(num(val(a,'Relevanzscore (0-100)'))||-1))}stats();render();updateSuggestions()}
function stats(){$('shown').textContent=filtered.length;$('total').textContent=rows.length;$('cats').textContent=new Set(filtered.map(r=>norm(val(r,'Kategorie'))).filter(Boolean)).size;let sc=filtered.map(r=>num(val(r,'Relevanzscore (0-100)'))).filter(Number.isFinite);$('avg').textContent=sc.length?(sc.reduce((a,b)=>a+b,0)/sc.length).toFixed(1).replace('.',','):'–';let q=norm($('q').value);$('meta').textContent=q?`${filtered.length} globale Suchtreffer · Filter ignoriert`:`${filtered.length} von ${rows.length} Plugins · ${selected.size} Felder aktiv`;$('fc').textContent=`${selected.size}/${fields.length}`}
function updateSuggestions(){const q=low($('q').value),box=$('suggest');suggestIndex=-1;suggestions=[];box.innerHTML='';if(!q){box.classList.remove('open');return}suggestions=rows.map(r=>({r,s:nameScore(r,q)})).filter(x=>x.s<99).sort((a,b)=>a.s-b.s||norm(val(a.r,'Plugin')).localeCompare(norm(val(b.r,'Plugin')),'de')).slice(0,8).map(x=>x.r);if(!suggestions.length){box.classList.remove('open');return}suggestions.forEach((r,i)=>{let d=document.createElement('div');d.className='sitem';d.dataset.i=i;let left=document.createElement('div'),n=document.createElement('div'),c=document.createElement('div'),t=document.createElement('div');n.className='sname';n.textContent=val(r,'Plugin');c.className='scat';c.textContent=norm(val(r,'Kategorie'))||'Plugin';t.className='stype';let s=nameScore(r,q);t.textContent=s<1?'Exakt':s<3?'Name':s<5?'Passend':'Ähnlich';left.append(n,c);d.append(left,t);d.addEventListener('mousedown',e=>{e.preventDefault();chooseSuggestion(i)});box.append(d)});box.classList.add('open')}
function chooseSuggestion(i){let r=suggestions[i];if(!r)return;$('q').value=val(r,'Plugin');$('suggest').classList.remove('open');apply();openDrawer(r)}
function render(){view==='table'?renderTable():renderCards();$('vc').classList.toggle('on',view==='cards');$('vt').classList.toggle('on',view==='table')}
function renderCards(){let box=$('cards');$('table').hidden=true;box.hidden=false;box.innerHTML='';if(!filtered.length){box.innerHTML='<div class="empty">Keine Treffer.</div>';return}filtered.forEach(r=>{let card=document.createElement('article');card.className='card';card.addEventListener('click',e=>{if(!e.target.closest('a,button'))openDrawer(r)});let top=document.createElement('div');top.className='ctop';let ti=document.createElement('div');ti.className='title';ti.textContent=val(r,'Plugin');top.append(ti);if(selected.has('Relevanzscore (0-100)')&&has(val(r,'Relevanzscore (0-100)'))){let sc=document.createElement('div');sc.className='score';sc.textContent=text(val(r,'Relevanzscore (0-100)'))+'/100';top.append(sc)}card.append(top);let badges=document.createElement('div');badges.className='badges';['Kategorie','Bei dir installiert','Kostenloser Basistarif?'].forEach(f=>{if(selected.has(f)&&has(val(r,f))){let b=document.createElement('span');b.className='badge';b.textContent=(f==='Kategorie'?'':f+': ')+text(val(r,f));badges.append(b)}});if(badges.children.length)card.append(badges);[...selected].forEach(f=>{if(['Plugin','Relevanzscore (0-100)','Kategorie','Bei dir installiert','Kostenloser Basistarif?'].includes(f))return;let v=val(r,f);if($('hide').checked&&!has(v))return;card.append(makeField(f,v,true))});box.append(card)})}
function makeField(f,v,clamp){let w=document.createElement('div');w.className='field';let l=document.createElement('div');l.className='fl';l.textContent=f;let x=document.createElement('div');x.className='fv';rich(x,text(v));w.append(l,x);if(clamp&&$('compact').checked&&text(v).length>260){x.classList.add('clamp');let b=document.createElement('button');b.className='more';b.textContent='Mehr anzeigen';b.onclick=e=>{e.stopPropagation();x.classList.toggle('clamp');b.textContent=x.classList.contains('clamp')?'Mehr anzeigen':'Weniger anzeigen'};w.append(b)}return w}
function renderTable(){let c=$('table');$('cards').hidden=true;c.hidden=false;c.innerHTML='';let wrap=document.createElement('div');wrap.className='tablewrap';let table=document.createElement('table'),thead=document.createElement('thead'),hr=document.createElement('tr');['Plugin',...[...selected].filter(f=>f!=='Plugin')].forEach(f=>{let th=document.createElement('th');th.textContent=f;hr.append(th)});thead.append(hr);table.append(thead);let tb=document.createElement('tbody');filtered.forEach(r=>{let tr=document.createElement('tr');tr.onclick=()=>openDrawer(r);['Plugin',...[...selected].filter(f=>f!=='Plugin')].forEach(f=>{let td=document.createElement('td');let v=val(r,f);if(!$('hide').checked||has(v))rich(td,text(v));tr.append(td)});tb.append(tr)});table.append(tb);wrap.append(table);c.append(wrap)}

function closeDrawer(){$('drawer').classList.remove('open');$('dbg').classList.remove('open')}
function csv(){let fs=['Plugin',...[...selected].filter(f=>f!=='Plugin')],esc=v=>{let s=text(v);return /[",\n]/.test(s)?'"'+s.replace(/"/g,'""')+'"':s},lines=[fs.map(esc).join(',')];filtered.forEach(r=>lines.push(fs.map(f=>esc(val(r,f))).join(',')));let a=document.createElement('a');a.href=URL.createObjectURL(new Blob(['\ufeff'+lines.join('\n')],{type:'text/csv;charset=utf-8'}));a.download='plugin-daten.csv';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
$('q').addEventListener('input',apply);$('q').addEventListener('focus',updateSuggestions);$('q').addEventListener('keydown',e=>{if(!$('suggest').classList.contains('open'))return;if(e.key==='ArrowDown'){e.preventDefault();suggestIndex=Math.min(suggestIndex+1,suggestions.length-1)}else if(e.key==='ArrowUp'){e.preventDefault();suggestIndex=Math.max(suggestIndex-1,0)}else if(e.key==='Enter'&&suggestIndex>=0){e.preventDefault();chooseSuggestion(suggestIndex);return}else if(e.key==='Escape'){$('suggest').classList.remove('open');return}else return;[...$('suggest').children].forEach((x,i)=>x.classList.toggle('active',i===suggestIndex))});
$('clearq').onclick=()=>{$('q').value='';$('q').focus();apply()};document.addEventListener('click',e=>{if(!e.target.closest('.searchwrap'))$('suggest').classList.remove('open')});['cat','inst','free','sort','hide','compact'].forEach(id=>$(id).addEventListener('change',apply));$('reset').onclick=()=>{$('q').value='';$('cat').value='';$('inst').value='';$('free').value='';$('sort').value='score';$('hide').checked=true;$('compact').checked=true;apply()};$('fields').onclick=()=>{$('mbg').classList.add('open');fieldGrid()};$('mx').onclick=()=>$('mbg').classList.remove('open');$('ok').onclick=()=>{localStorage.plugin_fields=JSON.stringify([...selected]);$('mbg').classList.remove('open');apply()};$('def').onclick=()=>{selected=new Set(DEF.filter(f=>fields.includes(f)));selected.add('Plugin');fieldGrid()};$('all').onclick=()=>{selected=new Set(fields);fieldGrid()};$('none').onclick=()=>{selected=new Set(['Plugin']);fieldGrid()};$('fs').oninput=fieldGrid;$('export').onclick=csv;$('vc').onclick=()=>{view='cards';localStorage.plugin_view=view;render()};$('vt').onclick=()=>{view='table';localStorage.plugin_view=view;render()};$('dx').onclick=closeDrawer;$('dbg').onclick=closeDrawer;$('dsel').onclick=()=>{detailAll=false;drawDetail()};$('dall').onclick=()=>{detailAll=true;drawDetail()};document.addEventListener('keydown',e=>{if(e.key==='Escape'){closeDrawer();$('mbg').classList.remove('open')}});load();
</script>
</body>
