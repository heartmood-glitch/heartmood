<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Plugin-Datenbank</title>
<style>
:root{--bg:#f5f6f8;--p:#fff;--t:#17191c;--m:#6b7280;--l:#e5e7eb;--a:#111827}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--t);font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif}button,input,select{font:inherit}button{cursor:pointer}.top{position:sticky;top:0;z-index:20;background:rgba(245,246,248,.95);backdrop-filter:blur(14px);border-bottom:1px solid var(--l)}.topin{max-width:1500px;margin:auto;padding:14px 18px;display:flex;gap:10px;align-items:center}.brand{font-weight:800;white-space:nowrap}.search{flex:1;border:1px solid #d1d5db;border-radius:12px;padding:11px 13px;background:#fff}.btn{border:1px solid #d1d5db;background:#fff;border-radius:11px;padding:10px 12px}.btn.dark{background:#111827;color:#fff;border-color:#111827}.wrap{max-width:1500px;margin:auto;padding:16px 18px 36px;display:grid;grid-template-columns:245px 1fr;gap:16px}.side{background:#fff;border:1px solid var(--l);border-radius:16px;padding:14px;align-self:start;position:sticky;top:82px}.side h3{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--m);margin:4px 0 10px}.ctl{display:grid;gap:5px;margin-bottom:11px}.ctl label{font-size:12px;color:var(--m)}select{width:100%;border:1px solid #d1d5db;border-radius:9px;padding:8px;background:#fff}.checks{font-size:13px;display:grid;gap:8px;margin:10px 0 16px}.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:9px;margin-bottom:12px}.stat{background:#fff;border:1px solid var(--l);border-radius:13px;padding:11px 12px}.stat b{font-size:19px;display:block}.stat span{font-size:11px;color:var(--m)}.head{display:flex;justify-content:space-between;align-items:center;margin:4px 0 10px;color:var(--m);font-size:13px}.toggle{border:1px solid #d1d5db;border-radius:9px;overflow:hidden;display:flex}.toggle button{border:0;background:#fff;padding:7px 10px}.toggle .on{background:#111827;color:#fff}.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:10px}.card{background:#fff;border:1px solid var(--l);border-radius:15px;padding:15px;box-shadow:0 2px 8px rgba(0,0,0,.025)}.card:hover{border-color:#cbd0d7}.ctop{display:flex;justify-content:space-between;gap:10px}.title{font-weight:780;font-size:17px}.score{font-size:12px;border:1px solid #d1d5db;border-radius:999px;padding:5px 8px;height:max-content}.badges{display:flex;flex-wrap:wrap;gap:5px;margin:8px 0}.badge{font-size:11px;border:1px solid var(--l);background:#f3f4f6;border-radius:999px;padding:4px 7px}.field{border-top:1px solid #f0f1f3;padding-top:8px;margin-top:8px}.fl{font-size:11px;color:var(--m);font-weight:700;margin-bottom:3px}.fv{font-size:13px;line-height:1.45;white-space:pre-wrap;word-break:break-word}.clamp{display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden}.more{border:0;background:none;padding:3px 0;color:#4b5563;text-decoration:underline;font-size:11px}.empty{background:#fff;border:1px dashed #d1d5db;border-radius:14px;padding:38px;text-align:center;color:var(--m)}.modalbg,.drawbg{position:fixed;inset:0;background:rgba(17,24,39,.3);z-index:50;display:none}.modalbg.open,.drawbg.open{display:flex}.modalbg{align-items:center;justify-content:center;padding:18px}.modal{width:min(850px,100%);max-height:86vh;background:#fff;border-radius:18px;overflow:hidden;display:flex;flex-direction:column}.mh,.mf{padding:14px 16px;border-bottom:1px solid var(--l);display:flex;justify-content:space-between;gap:8px;align-items:center}.mf{border-top:1px solid var(--l);border-bottom:0}.mb{padding:14px 16px;overflow:auto}.fieldsearch{width:100%;border:1px solid #d1d5db;border-radius:9px;padding:8px 10px;margin-bottom:10px}.fg{display:grid;grid-template-columns:repeat(2,1fr);gap:5px 15px}.fo{font-size:13px;padding:7px 2px;border-bottom:1px solid #f3f4f6;display:flex;gap:8px;align-items:flex-start}.drawer{position:fixed;right:0;top:0;bottom:0;width:min(720px,94vw);background:#fff;z-index:60;transform:translateX(101%);transition:.2s;display:flex;flex-direction:column;box-shadow:-15px 0 40px rgba(0,0,0,.15)}.drawer.open{transform:translateX(0)}.dh{padding:16px;border-bottom:1px solid var(--l);display:flex;justify-content:space-between}.db{padding:16px;overflow:auto}.detail{border:1px solid var(--l);border-radius:11px;padding:10px;margin-bottom:9px}.tablewrap{overflow:auto;background:#fff;border:1px solid var(--l);border-radius:14px}table{border-collapse:collapse;width:100%;font-size:12px}th,td{padding:9px 10px;border-bottom:1px solid var(--l);vertical-align:top;text-align:left;min-width:150px;max-width:380px}th{position:sticky;top:0;background:#fafafa}a{color:#1d4ed8}.err{background:#fff4f4;border:1px solid #fecaca;color:#7f1d1d;padding:14px;border-radius:12px;margin-bottom:10px}@media(max-width:900px){.wrap{grid-template-columns:1fr}.side{position:static}.stats{grid-template-columns:repeat(2,1fr)}}@media(max-width:650px){.topin{flex-wrap:wrap}.brand{width:100%}.search{order:3;flex-basis:100%}.wrap{padding:11px}.cards{grid-template-columns:1fr}.fg{grid-template-columns:1fr}}
</style>
</head>
<body>
<header class="top"><div class="topin"><div class="brand">Plugin-Datenbank</div><input id="q" class="search" placeholder="Plugins und Inhalte durchsuchen …"><button id="fields" class="btn">Felder <span id="fc"></span></button><button id="export" class="btn">CSV</button></div></header>
<main class="wrap"><aside class="side"><h3>Filter</h3><div class="ctl"><label>Kategorie</label><select id="cat"><option value="">Alle Kategorien</option></select></div><div class="ctl"><label>Installiert</label><select id="inst"><option value="">Alle</option><option value="yes">Ja</option><option value="no">Nein</option></select></div><div class="ctl"><label>Kostenlos</label><select id="free"><option value="">Alle</option><option value="yes">Ja</option><option value="no">Nein</option></select></div><h3>Sortierung</h3><div class="ctl"><select id="sort"><option value="score">Relevanz</option><option value="az">Name A–Z</option><option value="za">Name Z–A</option><option value="cat">Kategorie</option><option value="rank">Rang</option></select></div><div class="checks"><label><input id="hide" type="checkbox" checked> Leere Felder ausblenden</label><label><input id="compact" type="checkbox" checked> Lange Texte einklappen</label></div><button id="reset" class="btn" style="width:100%">Filter zurücksetzen</button></aside><section><div id="err"></div><div class="stats"><div class="stat"><b id="shown">–</b><span>angezeigt</span></div><div class="stat"><b id="total">–</b><span>gesamt</span></div><div class="stat"><b id="cats">–</b><span>Kategorien</span></div><div class="stat"><b id="avg">–</b><span>Ø Relevanz</span></div></div><div class="head"><span id="meta">Lade Daten …</span><div class="toggle"><button id="vc" class="on">Karten</button><button id="vt">Tabelle</button></div></div><div id="cards" class="cards"></div><div id="table" hidden></div></section></main>
<div id="mbg" class="modalbg"><div class="modal"><div class="mh"><b>Sichtbare Felder</b><div><button id="def" class="btn">Standard</button> <button id="all" class="btn">Alle</button> <button id="none" class="btn">Keine</button> <button id="mx" class="btn">✕</button></div></div><div class="mb"><input id="fs" class="fieldsearch" placeholder="Feld suchen …"><div id="fg" class="fg"></div></div><div class="mf"><span id="sel"></span><button id="ok" class="btn dark">Übernehmen</button></div></div></div>
<div id="dbg" class="drawbg"></div><aside id="drawer" class="drawer"><div class="dh"><div><b id="dt"></b><div id="ds" style="font-size:12px;color:#6b7280;margin-top:3px"></div></div><button id="dx" class="btn">✕</button></div><div style="padding:10px 16px;border-bottom:1px solid #e5e7eb"><button id="dsel" class="btn">Ausgewählte Felder</button> <button id="dall" class="btn">Alle Felder</button></div><div id="db" class="db"></div></aside>
<script>
const URL='https://epakearutehemjakjmvq.supabase.co/rest/v1/rpc/get_plugins_for_web',KEY='sb_publishable_nzaPPVShDGNvkdbU_Wnvaw_1ChzOPT4';
const DEF=['Kategorie','Relevanzscore (0-100)','Kernfunktion','Bei dir installiert','Normaler Chat (Plus)?','Schreiben/Aktionen','Kostenloser Basistarif?','Free-Limits / Funktionen','Automatisierungspotenzial','Praktischer Nutzen im Free-Limit'];
const PRI=['Plugin','Kategorie','Relevanzscore (0-100)','Rang in Kategorie','Kernfunktion','Bei dir installiert','Lesen','Schreiben/Aktionen','Normaler Chat (Plus)?','Web-Textchat','Desktop-App Textchat','Mobile Textchat (Android/iOS)','Voice Live','Voice Standard/Advanced','Kostenloser Basistarif?','Free-Limits / Funktionen','Kosten / Drittanbieter-Konto','Automatisierungspotenzial','Web/externes System?','Externe Reichweite Details','Praxis-/Bridge-Nutzung','Kombinationsideen','Vergleich / Ranking-Begründung','Direkte Alternativen / Vergleichsgruppe','Berechtigung / Evidenz','Offizielle Quelle / Detail','Community-Quellen','Recherche-Status','Plattform-Recherche-Status','Oberflächen-/Funktionsunterschiede','Work/Codex-Abgrenzung','Praktischer Nutzen im Free-Limit','Erstmals gesehen','Letzte Prüfung','Claim_Status','Claim_Timestamp','Claim_Owner','Claim_Run_ID','Claim_Expires_At','Claim_Note'];
let rows=[],filtered=[],fields=[],selected=new Set(),view=localStorage.plugin_view||'cards',active=null,detailAll=false;const $=x=>document.getElementById(x),norm=v=>String(v??'').trim(),low=v=>norm(v).toLowerCase(),yes=v=>/^(ja|yes|true)\b/i.test(norm(v)),no=v=>/^(nein|no|false)\b/i.test(norm(v)),num=v=>{let m=norm(v).replace(',','.').match(/-?\d+(?:\.\d+)?/);return m?+m[0]:NaN},p=r=>r?.payload&&typeof r.payload==='object'?r.payload:{},val=(r,f)=>f==='Plugin'?(p(r).Plugin||r.plugin_name||''):p(r)[f],has=v=>v!==null&&v!==undefined&&(typeof v!=='string'||v.trim()!=='')&&(!Array.isArray(v)||v.length),text=v=>v&&typeof v==='object'?JSON.stringify(v,null,2):String(v??'');
function rich(el,s){el.textContent='';let re=/(https?:\/\/[^\s<>"')\]]+)/g,last=0,m;while((m=re.exec(s))){if(m.index>last)el.append(document.createTextNode(s.slice(last,m.index)));let a=document.createElement('a');a.href=m[0];a.target='_blank';a.rel='noopener';a.textContent=m[0];el.append(a);last=m.index+m[0].length}if(last<s.length)el.append(document.createTextNode(s.slice(last)))}
function order(fs){let pos=new Map(PRI.map((x,i)=>[x,i]));return [...fs].sort((a,b)=>(pos.get(a)??9999)-(pos.get(b)??9999)||a.localeCompare(b,'de'))}
async function load(){try{let r=await fetch(URL,{method:'POST',headers:{apikey:KEY,'Content-Type':'application/json'},body:'{}'});if(!r.ok)throw Error(await r.text());rows=await r.json();let u=new Set(['Plugin']);rows.forEach(x=>Object.keys(p(x)).forEach(k=>u.add(k)));fields=order(u);let saved;try{saved=JSON.parse(localStorage.plugin_fields||'null')}catch{}selected=new Set((Array.isArray(saved)?saved:DEF).filter(x=>u.has(x)));selected.add('Plugin');fillCats();fieldGrid();apply()}catch(e){$('err').innerHTML='<div class="err">Daten konnten nicht geladen werden: '+String(e.message).replace(/[<>]/g,'')+'</div>'}}
function fillCats(){let cs=[...new Set(rows.map(r=>norm(val(r,'Kategorie'))).filter(Boolean))].sort((a,b)=>a.localeCompare(b,'de'));cs.forEach(c=>{let o=document.createElement('option');o.value=o.textContent=c;$('cat').append(o)})}
function apply(){let q=low($('q').value),cat=$('cat').value,inst=$('inst').value,free=$('free').value;filtered=rows.filter(r=>{if(q&&!([r.plugin_name,...Object.keys(p(r)),...Object.values(p(r)).map(text)].join(' ').toLowerCase().includes(q)))return false;if(cat&&norm(val(r,'Kategorie'))!==cat)return false;if(inst==='yes'&&!yes(val(r,'Bei dir installiert')))return false;if(inst==='no'&&!no(val(r,'Bei dir installiert')))return false;if(free==='yes'&&!yes(val(r,'Kostenloser Basistarif?')))return false;if(free==='no'&&!no(val(r,'Kostenloser Basistarif?')))return false;return true});let s=$('sort').value;filtered.sort((a,b)=>s==='az'?norm(a.plugin_name).localeCompare(norm(b.plugin_name),'de'):s==='za'?norm(b.plugin_name).localeCompare(norm(a.plugin_name),'de'):s==='cat'?norm(val(a,'Kategorie')).localeCompare(norm(val(b,'Kategorie')),'de'):s==='rank'?(num(val(a,'Rang in Kategorie'))||9999)-(num(val(b,'Rang in Kategorie'))||9999):(num(val(b,'Relevanzscore (0-100)'))||-1)-(num(val(a,'Relevanzscore (0-100)'))||-1));stats();render()}
function stats(){$('shown').textContent=filtered.length;$('total').textContent=rows.length;$('cats').textContent=new Set(filtered.map(r=>norm(val(r,'Kategorie'))).filter(Boolean)).size;let sc=filtered.map(r=>num(val(r,'Relevanzscore (0-100)'))).filter(Number.isFinite);$('avg').textContent=sc.length?(sc.reduce((a,b)=>a+b,0)/sc.length).toFixed(1).replace('.',','):'–';$('meta').textContent=`${filtered.length} von ${rows.length} Plugins · ${selected.size} Felder aktiv`;$('fc').textContent=`${selected.size}/${fields.length}`}
function fblock(label,v,cl=true){let w=document.createElement('div');w.className='field';let l=document.createElement('div');l.className='fl';l.textContent=label;let d=document.createElement('div');d.className='fv';rich(d,text(v));w.append(l,d);if(cl&&$('compact').checked&&text(v).length>260){d.classList.add('clamp');let b=document.createElement('button');b.className='more';b.textContent='Mehr anzeigen';b.onclick=e=>{e.stopPropagation();d.classList.toggle('clamp');b.textContent=d.classList.contains('clamp')?'Mehr anzeigen':'Weniger anzeigen'};w.append(b)}return w}
function render(){view==='table'?table():cards();$('vc').classList.toggle('on',view==='cards');$('vt').classList.toggle('on',view==='table')}
function cards(){$('table').hidden=true;$('cards').hidden=false;$('cards').innerHTML='';if(!filtered.length){$('cards').innerHTML='<div class="empty">Keine Treffer.</div>';return}filtered.forEach(r=>{let c=document.createElement('article');c.className='card';c.onclick=e=>{if(!e.target.closest('a,button'))open(r)};let top=document.createElement('div');top.className='ctop';let t=document.createElement('div');t.className='title';t.textContent=val(r,'Plugin');top.append(t);if(selected.has('Relevanzscore (0-100)')&&has(val(r,'Relevanzscore (0-100)'))){let s=document.createElement('div');s.className='score';s.textContent=val(r,'Relevanzscore (0-100)')+'/100';top.append(s)}c.append(top);let bd=document.createElement('div');bd.className='badges';['Kategorie','Bei dir installiert','Kostenloser Basistarif?'].forEach(f=>{if(selected.has(f)&&has(val(r,f))){let b=document.createElement('span');b.className='badge';b.textContent=(f==='Kategorie'?'':f+': ')+text(val(r,f));bd.append(b)}});if(bd.children.length)c.append(bd);[...selected].forEach(f=>{if(['Plugin','Relevanzscore (0-100)','Kategorie','Bei dir installiert','Kostenloser Basistarif?'].includes(f))return;let v=val(r,f);if($('hide').checked&&!has(v))return;c.append(fblock(f,v,true))});$('cards').append(c)})}
function table(){$('cards').hidden=true;$('table').hidden=false;let cols=['Plugin',...[...selected].filter(f=>f!=='Plugin')],w=document.createElement('div');w.className='tablewrap';let t=document.createElement('table'),h=document.createElement('tr');cols.forEach(f=>{let th=document.createElement('th');th.textContent=f;h.append(th)});t.append(h);filtered.forEach(r=>{let tr=document.createElement('tr');tr.onclick=()=>open(r);cols.forEach(f=>{let td=document.createElement('td');rich(td,text(val(r,f)));tr.append(td)});t.append(tr)});w.append(t);$('table').innerHTML='';$('table').append(w)}
function fieldGrid(){let q=low($('fs').value);$('fg').innerHTML='';fields.filter(f=>!q||low(f).includes(q)).forEach(f=>{let l=document.createElement('label');l.className='fo',c=document.createElement('input');c.type='checkbox';c.checked=selected.has(f);if(f==='Plugin'){c.checked=true;c.disabled=true}c.onchange=()=>{c.checked?selected.add(f):selected.delete(f);selTxt()};l.append(c,document.createTextNode(f));$('fg').append(l)});selTxt()}
function selTxt(){$('sel').textContent=`${selected.size} von ${fields.length} Feldern ausgewählt`}
function open(r){active=r;detailAll=false;$('dt').textContent=val(r,'Plugin');$('ds').textContent='ID '+r.id;draw();$('dbg').classList.add('open');$('drawer').classList.add('open')}
function draw(){$('db').innerHTML='';(detailAll?fields:[...selected]).forEach(f=>{let v=val(active,f);if($('hide').checked&&!has(v))return;let d=document.createElement('div');d.className='detail';let l=document.createElement('div');l.className='fl';l.textContent=f;let x=document.createElement('div');x.className='fv';rich(x,text(v));d.append(l,x);$('db').append(d)})}
function closeD(){$('dbg').classList.remove('open');$('drawer').classList.remove('open')}
function csv(){let cols=['Plugin',...[...selected].filter(f=>f!=='Plugin')],esc=v=>{let s=text(v);return /[",\n]/.test(s)?'"'+s.replace(/"/g,'""')+'"':s},lines=[cols.map(esc).join(',')];filtered.forEach(r=>lines.push(cols.map(f=>esc(val(r,f))).join(',')));let a=document.createElement('a');a.href=URL.createObjectURL(new Blob(['\ufeff'+lines.join('\n')],{type:'text/csv'}));a.download='plugin-daten.csv';a.click()}
['q'].forEach(i=>$(i).oninput=apply);['cat','inst','free','sort','hide','compact'].forEach(i=>$(i).onchange=apply);$('reset').onclick=()=>{$('q').value='';$('cat').value=$('inst').value=$('free').value='';$('sort').value='score';$('hide').checked=$('compact').checked=true;apply()};$('fields').onclick=()=>{$('mbg').classList.add('open');fieldGrid()};$('mx').onclick=()=>$('mbg').classList.remove('open');$('ok').onclick=()=>{localStorage.plugin_fields=JSON.stringify([...selected]);$('mbg').classList.remove('open');apply()};$('fs').oninput=fieldGrid;$('def').onclick=()=>{selected=new Set(DEF.filter(f=>fields.includes(f)));selected.add('Plugin');fieldGrid()};$('all').onclick=()=>{selected=new Set(fields);fieldGrid()};$('none').onclick=()=>{selected=new Set(['Plugin']);fieldGrid()};$('vc').onclick=()=>{view='cards';localStorage.plugin_view=view;render()};$('vt').onclick=()=>{view='table';localStorage.plugin_view=view;render()};$('export').onclick=csv;$('dx').onclick=closeD;$('dbg').onclick=closeD;$('dsel').onclick=()=>{detailAll=false;draw()};$('dall').onclick=()=>{detailAll=true;draw()};load();
</script>
</body></html>
